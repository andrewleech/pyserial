name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=serial --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-vtty-linux:
    name: Test with vtty virtual serial ports
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          allow-prereleases: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install kernel headers
        id: kernel-headers
        run: |
          set +e
          # Primary: Try exact kernel version
          sudo apt-get install -y linux-headers-$(uname -r) 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback 1: Try generic headers for kernel series
          KERNEL_VERSION=$(uname -r | sed 's/-[^-]*$//')
          sudo apt-get install -y linux-headers-${KERNEL_VERSION}-generic 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback 2: Try any available headers for major version
          KERNEL_MAJOR=$(uname -r | cut -d. -f1-2)
          sudo apt-get install -y "linux-headers-*${KERNEL_MAJOR}*" 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "WARNING: No matching kernel headers found"
          echo "available=false" >> $GITHUB_OUTPUT

      - name: Build vtty module
        if: steps.kernel-headers.outputs.available == 'true'
        run: |
          echo "=== Cloning vtty repository ==="
          git clone https://github.com/anszom/vtty.git vtty-module
          cd vtty-module
          echo "=== Building vtty module ==="
          make
          echo "=== Loading vtty kernel module ==="
          sudo insmod vtty.ko
          echo "=== Setting permissions on /dev/vtmx ==="
          sudo chmod 666 /dev/vtmx
          echo "=== Verifying module loaded ==="
          lsmod | grep -A2 vtty
          echo "=== Verifying /dev/vtmx device exists ==="
          ls -la /dev/vtmx

      - name: Install test dependencies
        if: steps.kernel-headers.outputs.available == 'true'
        run: |
          echo "=== Installing pyserial ==="
          uv pip install --system -e .
          echo "=== Installing test dependencies ==="
          uv pip install --system pytest pytest-cov
          echo "=== Verifying installations ==="
          python3 -m pytest --version
          python3 -c "import serial; print(f'pyserial version: {serial.VERSION}')"

      - name: Create vtty helper script
        if: steps.kernel-headers.outputs.available == 'true'
        run: |
          mkdir -p ci
          cp scripts/ci_vtty_helper.py ci/

      - name: Run tests with vtty
        if: steps.kernel-headers.outputs.available == 'true'
        run: |
          set -e
          echo "=== Creating vtty virtual serial port pair ==="
          VTTY_ENV=$(python3 scripts/ci_vtty_helper.py)
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to create vtty pair"
            exit 1
          fi
          echo "=== Helper script output ==="
          echo "$VTTY_ENV"
          echo "=== Evaluating environment variables ==="
          eval "$VTTY_ENV"
          echo "=== Verifying environment ==="
          echo "PYSERIAL_PORT=${PYSERIAL_PORT}"
          echo "PYSERIAL_PORT_PAIR=${PYSERIAL_PORT_PAIR}"
          if [ -z "$PYSERIAL_PORT" ] || [ -z "$PYSERIAL_PORT_PAIR" ]; then
            echo "ERROR: Environment variables not set properly"
            exit 1
          fi
          echo "=== Running pytest with vtty devices ==="
          pytest -v --cov=serial --cov-report=xml --cov-report=term --tb=short

      - name: Upload coverage to Codecov
        if: steps.kernel-headers.outputs.available == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Cleanup
        if: always() && steps.kernel-headers.outputs.available == 'true'
        run: |
          echo "=== Cleaning up vtty resources ==="
          if [ -n "$VTTY_KEEPER_PID" ]; then
            echo "Killing keeper process (PID $VTTY_KEEPER_PID)"
            kill $VTTY_KEEPER_PID 2>/dev/null || true
            sleep 1
          fi
          echo "Unloading vtty module"
          sudo rmmod vtty || true
          echo "Cleanup complete"
