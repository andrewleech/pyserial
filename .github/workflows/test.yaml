name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # TODO: Re-enable macos-latest when separate issue is resolved
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=serial --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-tty0tty-linux:
    name: Test with tty0tty null-modem emulator
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          allow-prereleases: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install kernel headers
        id: kernel-headers
        run: |
          set +e
          # Primary: Try exact kernel version
          sudo apt-get install -y linux-headers-$(uname -r) 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback 1: Try generic headers for kernel series
          KERNEL_VERSION=$(uname -r | sed 's/-[^-]*$//')
          sudo apt-get install -y linux-headers-${KERNEL_VERSION}-generic 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback 2: Try any available headers for major version
          KERNEL_MAJOR=$(uname -r | cut -d. -f1-2)
          sudo apt-get install -y "linux-headers-*${KERNEL_MAJOR}*" 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "WARNING: No matching kernel headers found"
          echo "available=false" >> $GITHUB_OUTPUT

      - name: Build and load tty0tty module
        if: steps.kernel-headers.outputs.available == 'true'
        run: |
          echo "=== Cloning tty0tty repository ==="
          git clone https://github.com/freemed/tty0tty.git
          cd tty0tty/module
          echo "=== Building tty0tty module ==="
          make
          echo "=== Loading tty0tty kernel module ==="
          sudo insmod tty0tty.ko
          echo "=== Verifying module loaded ==="
          lsmod | grep tty0tty
          echo "=== Verifying tnt devices exist ==="
          ls -la /dev/tnt*
          echo "=== Setting permissions on tnt devices ==="
          echo 'KERNEL=="tnt[0-9]*", MODE="0666"' | sudo tee /etc/udev/rules.d/99-tty0tty.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/tnt*
          ls -la /dev/tnt*

      - name: Install test dependencies
        if: steps.kernel-headers.outputs.available == 'true'
        run: |
          echo "=== Installing pyserial ==="
          uv pip install --system -e .
          echo "=== Installing test dependencies ==="
          uv pip install --system pytest pytest-cov
          echo "=== Verifying installations ==="
          python3 -m pytest --version
          python3 -c "import serial; print(f'pyserial version: {serial.VERSION}')"

      - name: Run tests with tty0tty
        if: steps.kernel-headers.outputs.available == 'true'
        env:
          PYSERIAL_PORT: /dev/tnt0
        run: |
          echo "=== Testing with tty0tty null-modem devices ==="
          echo "Using /dev/tnt0 (paired with /dev/tnt1)"
          echo "Modem lines: RTS->CTS, DTR->DSR/CD automatically connected"
          pytest -v --cov=serial --cov-report=xml --cov-report=term --tb=short

      - name: Upload coverage to Codecov
        if: steps.kernel-headers.outputs.available == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Cleanup
        if: always() && steps.kernel-headers.outputs.available == 'true'
        run: |
          echo "=== Cleaning up tty0tty resources ==="
          sudo rmmod tty0tty || true
          echo "Cleanup complete"
